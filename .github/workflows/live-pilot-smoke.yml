name: Live Pilot Branding and Availability Smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: liliang-live-smoke
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Verify public Render pilot, exact official logo, and shared page branding
        env:
          PILOT_BASE_URL: https://liliang-multi-ai-erp-pilot.onrender.com
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          import time
          from pathlib import Path
          from urllib.error import HTTPError
          from urllib.request import Request, urlopen

          base = os.environ["PILOT_BASE_URL"].rstrip("/")
          expected = Path("static/branding/liliang-official.jpg").read_bytes()
          assert expected[:3] == b"\xff\xd8\xff", "Repo logo is not JPEG"
          expected_hash = hashlib.sha256(expected).hexdigest()
          paths = ["/", "/workspace", "/dashboard", "/inquiries", "/catalog",
                   "/ai/hybrid", "/ai/evidence", "/ai/status", "/sales/bundling",
                   "/inventory/forecast", "/admin/users", "/admin/roles", "/reports"]

          def fetch(path):
              req = Request(base + path, headers={"User-Agent": "LiLiang-Pilot-Smoke/1.0",
                                                   "Cache-Control": "no-cache"})
              with urlopen(req, timeout=35) as res:
                  return res.status, dict(res.headers.items()), res.read()

          # Render Free may have a cold-start delay or an asynchronous git deployment.
          last_error = None
          for attempt in range(1, 16):
              try:
                  code, _, raw = fetch("/healthz")
                  assert code == 200 and json.loads(raw)["status"] == "ok"
                  code, _, raw = fetch("/readyz")
                  assert code == 200 and json.loads(raw)["ready"] is True
                  code, headers, remote_logo = fetch("/branding/logo?v=20261020")
                  assert code == 200 and "image/jpeg" in headers.get("Content-Type", "")
                  actual_hash = hashlib.sha256(remote_logo).hexdigest()
                  assert actual_hash == expected_hash, (
                      "Live logo bytes differ from GitHub main: Render deployment is stale or wrong service. "
                      f"expected={expected_hash[:12]} got={actual_hash[:12]}")
                  print("Health OK; DB ready; exact official logo matches source SHA256", expected_hash[:16])
                  break
              except Exception as exc:
                  last_error = exc
                  print(f"Attempt {attempt}/15: {exc}", flush=True)
                  if attempt == 15:
                      raise RuntimeError("Live deploy NOT verified; inspect Render deploy and service URL") from last_error
                  time.sleep(20)

          for path in paths:
              code, headers, raw = fetch(path)
              assert code == 200, f"{path}: HTTP {code}"
              html = raw.decode("utf-8")
              assert '/branding/logo?v=20261020' in html, f"{path}: official logo reference absent"
              assert 'official-sidebar-logo' in html, f"{path}: shared branded app template absent"
              print(path, "OK, official branding reference included")

          try:
              fetch("/v1/ai/system-status")
          except HTTPError as exc:
              assert exc.code in (401, 403), f"Expected protected AI status, got {exc.code}"
              print("AI status requires authentication: access control OK")
          else:
              raise AssertionError("AI system-status unexpectedly public")

          print("PASS: public health/readiness, official live logo, 13 branded routes, auth boundary.")
          print("NOTE: This smoke test does NOT establish model accuracy, labeled training, or authenticated live AI performance.")
          PY

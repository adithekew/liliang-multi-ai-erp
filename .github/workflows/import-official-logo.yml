name: Install Official LiLiang Logo Asset
on:
  push:
    branches: [feat/official-liliang-branding-and-presentation-readiness-20261020]
    paths:
      - '.github/workflows/import-official-logo.yml'
permissions:
  contents: write
jobs:
  fetch-official-brand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Fetch PT. LiLiang official image once
        shell: bash
        env:
          LOGO_ASSET: "https://media.canva.com/v2/image-resize/format:JPG/height:53/quality:75/uri:ifs%3A%2F%2FM%2Fb75acc20-d28b-4fd1-af1e-281a1d3b72b7/watermark:F/width:200?csig=AAAAAAAAAAAAAAAAAAAAAPmDcy_MN9pBZLiAAa_E6x_1tm99wqB1APL1N7iw7mOs&exp=1792509373&osig=AAAAAAAAAAAAAAAAAAAAAPPxEiN1eTt7pjzgzIX_CVSjbGYU0-QvpJ7TlQPIMcs_&signer=media-rpc&token=AAIAAU0AJGI3NWFjYzIwLWQyOGItNGZkMS1hZjFlLTI4MWExZDNiNzJiNwAAAAABoVniakgFWLfKEEexCW93ThTpEnY0zFNXm3mz8oAc3YN5PfJ8Ng&x-canva-quality=thumbnail"
        run: |
          set -euo pipefail
          mkdir -p static/branding
          curl -fLsS --retry 3 --max-time 60 "$LOGO_ASSET" -o static/branding/liliang-official.jpg
          file static/branding/liliang-official.jpg
          test "$(wc -c < static/branding/liliang-official.jpg)" -gt 2500
          head -c 2 static/branding/liliang-official.jpg | od -A n -t x1 | tr -d ' \n' | grep -q '^ffd8'
      - name: Save official logo in source branch
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add static/branding/liliang-official.jpg
          git commit -m "assets: include user's original official PT. Liliang branding" 
          git push
